# NaturDex — despliegue sencillo con Docker Compose.
#   1. cp .env.example .env   (y define contraseñas fuertes: son OBLIGATORIAS)
#   2. docker compose up -d --build
#   3. Abre http://localhost:8080
#
# Este fichero es la base común. Compose lo combina automáticamente con docker-compose.override.yml
# (desarrollo local: publica el puerto 8080 por HTTP). Para producción con HTTPS se usa en su lugar
# docker-compose.prod.yml (proxy Caddy con certificado automático), ver DEPLOY.md:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# La primera vez, MySQL importa automáticamente Database/schema.sql y Database/seed.sql (el catálogo
# del parque piloto). Los datos persisten en el volumen db_data entre reinicios.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      # Contraseñas OBLIGATORIAS: si no están en .env, `docker compose up` falla con un mensaje
      # claro en vez de arrancar con credenciales débiles conocidas.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: naturadex
      MYSQL_USER: ${DB_USER:-naturdex}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
      # Los .sql se importan en orden alfabético SOLO en el primer arranque (BD vacía). Ambos crean
      # su propia BD (CREATE DATABASE naturadex), así que son autosuficientes. Montados de solo
      # lectura. El puerto de MySQL NO se publica al host: la BD solo es accesible desde la red
      # interna de compose (el contenedor web).
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./Database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      # La contraseña se pasa por variable de entorno (MYSQL_PWD), no como argumento visible en la
      # lista de procesos.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: naturadex
      # La app se conecta con un usuario dedicado (no root) con privilegios solo sobre su BD.
      DB_USER: ${DB_USER:-naturdex}
      DB_PASS: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      # Clave de AEMET OpenData para el widget del tiempo (Backend/Api/tiempo.php). OPCIONAL, a
      # diferencia de las de la BD: `:-` y no `:?`, para que un despliegue sin ella arranque igual.
      # Sin clave el endpoint responde 503 y el widget no se pinta, que es su degradación de diseño.
      AEMET_API_KEY: ${AEMET_API_KEY:-}
    # El puerto NO se publica aquí: en local lo publica docker-compose.override.yml (8080→80) y en
    # producción no se publica en absoluto (solo Caddy es accesible desde fuera, ver
    # docker-compose.prod.yml).

volumes:
  db_data:
