; Endurecido de PHP para el despliegue (mejora sobre el prototipo local).

; No mostrar errores/avisos al cliente (evita filtrar rutas, versiones o SQL en las respuestas);
; registrarlos en el log del servidor en su lugar.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; No revelar la versión de PHP en las cabeceras.
expose_php = Off

; Endurecido de la cookie de sesión.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; IMPORTANTE: si sirves por HTTPS (recomendado en producción), descomenta la línea siguiente para
; que la cookie de sesión solo viaje cifrada. Déjala comentada mientras pruebes por HTTP en local,
; o el login no funcionará.
; session.cookie_secure = 1
