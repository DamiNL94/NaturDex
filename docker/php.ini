; Endurecido de PHP para el despliegue (mejora sobre el prototipo local).

; No mostrar errores/avisos al cliente (evita filtrar rutas, versiones o SQL en las respuestas);
; registrarlos en el log del servidor en su lugar.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; No revelar la versión de PHP en las cabeceras.
expose_php = Off

; Endurecido de la cookie de sesión.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; session.cookie_secure NO se activa aquí a propósito: en local se sirve por HTTP y el login
; dejaría de funcionar. En producción (HTTPS con Caddy) lo activa docker-compose.prod.yml montando
; docker/php-https.ini, que se carga después de este fichero. Así local y producción conviven sin
; tocar configuración.
