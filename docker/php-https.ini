; Ajustes de PHP SOLO para producción con HTTPS. docker-compose.prod.yml monta este fichero en
; /etc/php82/conf.d/ (en local por HTTP no se monta, ver docker/php.ini para el porqué).

; La cookie de sesión solo viaja cifrada. El navegador habla HTTPS con Caddy, así que puede
; activarse aunque el tramo interno Caddy→Apache sea HTTP.
session.cookie_secure = 1
