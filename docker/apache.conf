# No revelar versión de Apache/OS en cabeceras ni páginas de error (contexto de servidor).
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    # La raíz del proyecto es el DocumentRoot: así el frontend (/Frontend/…) y la API
    # (/Backend/Api/…) quedan bajo el mismo origen, que es lo que espera el frontend
    # (Frontend/Js/auth.js usa API_BASE = '../Backend/Api').
    DocumentRoot /var/www/html
    DirectoryIndex index.html

    # Entrada de la app: al pedir la raíz "/" se redirige a la pantalla de portada.
    RedirectMatch ^/$ /Frontend/index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # SEGURIDAD: solo el frontend y la API PHP deben ser accesibles por web. El resto del código
    # (configuración con credenciales, librerías, volcados SQL, utilidades) NO debe poder
    # descargarse aunque esté bajo el DocumentRoot. Los .php de la API se ejecutan; estos otros
    # directorios se sirven como ficheros estáticos, así que hay que bloquearlos explícitamente.
    <DirectoryMatch "^/var/www/html/(Database|Tools|Backend/Config|Backend/Lib|Backend/Data)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Defensa en profundidad: nunca servir ficheros sensibles por extensión ni ficheros ocultos.
    # (No se incluye .json a propósito: el frontend sirve sus datos como .json/.geojson estáticos.)
    <FilesMatch "(^\.ht|\.(sql|ini|sh|yml|yaml|dist|log|md|lock)$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
