<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NaturDex · Administración</title>
    <link rel="icon" type="image/png" href="Img/icon-192.png">
    <link rel="stylesheet" href="Css/styles.css">
    <link rel="stylesheet" href="Css/admin.css">
</head>
<body class="admin-body">
    <!-- ===================== Acceso ===================== -->
    <section id="admin-login" class="screen screen-center" hidden>
        <div class="auth-card">
            <p class="eyebrow">NaturDex · Administración</p>
            <form id="adminLoginForm" novalidate>
                <label class="auth-field">Email
                    <input type="email" id="adminEmail" required autocomplete="email" placeholder="tu@email.com">
                </label>
                <label class="auth-field">Contraseña
                    <input type="password" id="adminPassword" required autocomplete="current-password">
                </label>
                <p class="auth-error" id="adminLoginError" hidden></p>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <a class="link-btn admin-back-link" href="index.html">← Volver a NaturDex</a>
        </div>
    </section>

    <!-- ===================== Panel ===================== -->
    <section id="admin-panel" hidden>
        <header class="admin-top">
            <div class="admin-title">
                <p class="eyebrow">NaturDex · Administración</p>
                <h1 id="adminParkName">—</h1>
            </div>
            <div class="admin-top-actions">
                <label class="admin-park-field">Parque
                    <select id="adminParkSelect"></select>
                </label>
                <button type="button" id="adminExportBtn" class="btn-secondary" title="Vuelca la base de datos al park.json que usa la app sin conexión">⬇️ Publicar cambios offline</button>
                <span id="adminUser" class="user-name"></span>
                <button type="button" id="adminLogout" class="icon-btn" title="Cerrar sesión" aria-label="Cerrar sesión">⏻</button>
            </div>
        </header>

        <nav class="admin-tabs" role="tablist">
            <button type="button" class="admin-tab active" data-tab="species" role="tab">Especies</button>
            <button type="button" class="admin-tab" data-tab="habitats" role="tab">Hábitats</button>
            <button type="button" class="admin-tab" data-tab="pois" role="tab">Puntos de interés</button>
        </nav>

        <main class="admin-main">
            <aside class="admin-list-pane">
                <div class="admin-list-head">
                    <input type="search" id="adminSearch" placeholder="Buscar…">
                    <button type="button" id="adminNewBtn" class="btn-primary admin-new-btn">+ Nuevo</button>
                </div>
                <div id="adminList" class="admin-list" role="listbox"></div>
            </aside>
            <section class="admin-form-pane">
                <form id="adminForm" novalidate hidden>
                    <div id="adminFields" class="admin-fields"></div>
                    <div class="admin-form-actions">
                        <button type="submit" class="btn-primary" id="adminSaveBtn">💾 Guardar</button>
                        <button type="button" class="btn-danger" id="adminDeleteBtn">🗑 Eliminar</button>
                    </div>
                </form>
                <p id="adminEmpty" class="admin-empty">Elige un elemento de la lista o crea uno nuevo.</p>
            </section>
        </main>
        <div id="adminToast" class="admin-toast" hidden></div>
    </section>

    <script type="module" src="Js/admin.js"></script>
</body>
</html>
